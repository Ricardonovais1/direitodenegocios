name: Daily Blog Post

on:
  schedule:
    # 11:00 UTC = 08:00 (Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish next post
        env:
          SANITY_PROJECT_ID: h0l4pk97
          SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: node scripts/publish-daily-post.mjs

      # Opção A — o site é estático, então o post só aparece após um rebuild.
      # Dispara o Deploy Hook do Cloudflare (gerado em Workers & Pages →
      # Settings → Builds & deployments). Guarde a URL em:
      #   GitHub → Settings → Secrets and variables → Actions
      #   como CLOUDFLARE_DEPLOY_HOOK.
      # Rebuilda mesmo nos dias em que a fila está vazia (o script sai com 0
      # nesse caso) — é barato e também publica edições manuais feitas no Sanity.
      - name: Trigger Cloudflare rebuild (deploy hook)
        if: secrets.CLOUDFLARE_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --request POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
